name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: lo-travel/package-lock.json

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Clean any Replit configuration
      - name: Clean npm configuration
        working-directory: lo-travel
        run: |
          rm -f .npmrc
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/
          npm config set fund false
          npm config set audit false

      # Verify npm registry
      - name: Verify npm registry
        run: npm config get registry

      # Clean project
      - name: Clean project
        working-directory: lo-travel
        run: |
          rm -rf node_modules
          rm -rf android

      # Install dependencies
      - name: Install dependencies
        working-directory: lo-travel
        env:
          NODE_ENV: production
        run: |
          npm ci

      # Generate fresh native Android project
      - name: Expo Prebuild
        working-directory: lo-travel
        env:
          NODE_ENV: production
        run: |
          npx expo prebuild --platform android --clean --non-interactive

      # Verify New Architecture
      - name: Verify gradle.properties
        run: |
          echo "===== gradle.properties ====="
          cat lo-travel/android/gradle.properties

      # Build APK
      - name: Build Debug APK
        working-directory: lo-travel/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: lo-travel/android/app/build/outputs/apk/debug/app-debug.apk
