name: Regenerate package-lock.json

on:
  workflow_dispatch:

jobs:
  clean-lockfile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lo-travel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reset npm configuration
        run: |
          set -e

          rm -f .npmrc
          rm -f package-lock.json
          rm -rf node_modules

          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/

          npm cache clean --force

      - name: Install dependencies and generate lock file
        run: |
          npm install

      - name: Verify lock file
        run: |
          test -f package-lock.json
          echo "package-lock.json successfully generated."

      - name: Upload regenerated package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: lo-travel/package-lock.json
