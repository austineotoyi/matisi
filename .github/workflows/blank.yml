name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          if [ ! -f "lo-travel-platform.zip" ]; then
            echo "ERROR: lo-travel-platform.zip not found."
            exit 1
          fi

          rm -rf lo-travel
          mkdir -p lo-travel
          unzip -q lo-travel-platform.zip -d lo-travel

          # Flatten if the ZIP contains a single root directory
          ROOT_DIR=$(find lo-travel -mindepth 1 -maxdepth 1 -type d | head -n1)
          DIR_COUNT=$(find lo-travel -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILE_COUNT=$(find lo-travel -mindepth 1 -maxdepth 1 -type f | wc -l)

          if [ "$DIR_COUNT" = "1" ] && [ "$FILE_COUNT" = "0" ]; then
            shopt -s dotglob
            mv "$ROOT_DIR"/* lo-travel/ || true
            rmdir "$ROOT_DIR" || true
          fi

      - name: Fix file permissions
        run: |
          chmod -R u+rwX lo-travel
          find lo-travel -type d -exec chmod 755 {} \;
          find lo-travel -type f -exec chmod 644 {} \;
          find lo-travel -name gradlew -exec chmod +x {} \;
          find lo-travel -name "*.sh" -exec chmod +x {} \;

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: lo-travel
        run: |
          if [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm
            pnpm install
          elif [ -f yarn.lock ]; then
            npm install -g yarn
            yarn install
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify Android project
        run: |
          test -f lo-travel/android/gradlew
          test -f lo-travel/android/app/build.gradle || test -f lo-travel/android/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: lo-travel/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        working-directory: lo-travel/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find lo-travel/android/app/build/outputs -name "*.apk" -exec cp {} artifacts/ \;

      - name: Generate SHA256
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: artifacts/
          if-no-files-found: error
