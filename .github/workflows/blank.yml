name: Extract Project

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf lo-travel
          mkdir lo-travel
          unzip -q lo-travel-platform.zip -d lo-travel

      - name: Remove Replit files
        run: |
          rm -f lo-travel/.npmrc
          rm -f lo-travel/.yarnrc
          rm -f lo-travel/.yarnrc.yml
          find lo-travel -name ".replit" -delete
          find lo-travel -name "replit.nix" -delete

      - name: Upload extracted project
        uses: actions/upload-artifact@v4
        with:
          name: lo-travel
          path: lo-travel
